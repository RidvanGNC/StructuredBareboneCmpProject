#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Kotlin/Native: skip targets the host cannot build (iOS on Windows/Linux) without failing.
kotlin.native.ignoreDisabledTargets=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Template version defaults. CI should override these with -Papp.version.* or
# APP_VERSION_* environment variables; GitHub Actions uses GITHUB_RUN_NUMBER automatically.
app.version.name=0.1.0-SNAPSHOT
app.version.code=1
