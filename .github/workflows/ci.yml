name: CI

# Verification gate: runs on every branch push and pull request, and can be reused by other workflows.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  kmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # JVM tests include the structure and style rule tests and the app flow UI tests in :composeApp.
      - name: Tests
        run: ./gradlew :data:jvmTest :viewmodel:jvmTest :feature:jvmTest :theme:jvmTest :navigation:jvmTest :packages:tenant:jvmTest :composeApp:jvmTest

      # The same common tests again on the Android target (withHostTest in each module's build file).
      - name: Android host tests
        run: ./gradlew :data:testAndroidHostTest :viewmodel:testAndroidHostTest :feature:testAndroidHostTest :theme:testAndroidHostTest :navigation:testAndroidHostTest :packages:tenant:testAndroidHostTest

      - name: Android lint
        run: ./gradlew :androidApp:lintDebug

      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug

      # R8 breakage shows only in a release build, so every change builds one (unsigned without a keystore).
      - name: Android release build (R8)
        run: ./gradlew :androidApp:assembleRelease

      - name: Desktop compile
        run: ./gradlew :desktopApp:compileKotlinJvm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Audit (all dependencies)
        run: npm audit

      - name: Audit (production dependencies)
        run: npm audit --omit=dev
