name: CI

# Verification gate: runs on every branch push and pull request, and can be reused by other workflows.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  kmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # JVM tests include the structure rule tests in :composeApp.
      - name: Tests
        run: ./gradlew :data:jvmTest :packages:tenant:jvmTest :composeApp:jvmTest

      - name: Android lint
        run: ./gradlew :androidApp:lintDebug

      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug

      - name: Desktop compile
        run: ./gradlew :desktopApp:compileKotlinJvm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Audit (all dependencies)
        run: npm audit

      - name: Audit (production dependencies)
        run: npm audit --omit=dev
